name: CI (branches)

# Fast branch gate. Runs on any branch other than main/master so that
# the problem surfaces before the PR—not later, in the middle of the heavy pipeline.
#
# Intentionally excluded: Playwright tests (E2E, requiring the app),
# image building, release, and deployment. All of that is handled by
# deploy.yml once the code reaches main. Here, there is only one question:
# is this code healthy enough to become a PR?
on:
  push:
    branches-ignore: [main, master]
  workflow_dispatch:

jobs:
  validate:
    name: Lint and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # First check of all, because it is the cheapest one. There is no point
      # spending minutes on tsc if the code is not even formatted.
      - name: Lint
        run: yarn lint:check

      - name: Type-check
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit
