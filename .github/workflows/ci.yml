name: CI (branches)

# Portao rapido de branch. Roda em toda branch que NAO seja a main/master, para
# o problema aparecer antes do PR — e nao depois, no meio da pipeline pesada.
#
# De proposito ficam de fora: os testes do Playwright (E2E, precisam da app de
# pe), o build da imagem, o release e o deploy. Tudo isso e responsabilidade do
# deploy.yml quando o codigo chega na main. Aqui a pergunta e uma so: esse
# codigo esta saudavel o bastante para virar PR?
on:
  push:
    branches-ignore: [main, master]
  workflow_dispatch:

jobs:
  validate:
    name: Lint and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Primeiro passo de verificacao: e o mais barato de todos. Nao faz sentido
      # gastar minutos no tsc se o codigo nem esta formatado.
      - name: Lint
        run: yarn lint:check

      - name: Type-check
        run: yarn typecheck
