name: Build and Push Frontend to GHCR

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # The run button is the PROMOTE-to-production trigger.
  #
  # `image_tag` is what gets promoted. `latest` is whatever the newest main
  # build produced — fine when nothing has landed since staging was validated.
  # Pin `main-<sha>` to promote exactly the build that was checked, even if
  # main has moved on in the meantime.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to promote to production"
        required: true
        default: "latest"

jobs:
  # Quality gate. Before this, nothing checked the front-end in CI: a type
  # error only showed up in `next build`, in the middle of the Docker job
  # and several minutes in — or slipped through entirely when the offending
  # file was not part of the build graph.
  quality:
    name: Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile base (node:22.21.1-alpine), the release job and
          # the local environment. Node 20 left support in April 2026 and does not
          # satisfy the engine required by part of the chain (semantic-release
          # requires ^22.14.0 || >=24.10.0).
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # First check of all, because it is the cheapest one. There is no point
      # spending minutes on tsc and the test suite if the code is not even
      # formatted.
      - name: Lint
        run: yarn lint:check

      - name: Type-check
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit

  release:
    name: Release (semantic-release)
    runs-on: ubuntu-latest
    # Depends on the build TOO, not only on the checks. Running in parallel, a
    # failing build-and-push did not hold the release back: the tag, the
    # CHANGELOG and the GitHub Release went out announcing a version whose
    # image never reached the registry. The release is the last step precisely
    # because it is the only irreversible one.
    needs: [quality, build-production]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write # create the tag and the release, and commit the CHANGELOG
      issues: write # comment on the issues closed by this version
      pull-requests: write # comment on the PRs included in this version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # semantic-release needs the full history: it finds the last tag and reads
          # the commits since then to decide whether the version goes up by patch,
          # minor or major. With the default shallow clone there is nothing to
          # analyse and no release is ever created.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # TWO builds, one per environment — and this is the one real difference from
  # the API pipeline.
  #
  # Next bakes every NEXT_PUBLIC_* value into the client bundle at BUILD time
  # (they arrive as build args in the Dockerfile). So a single image cannot
  # serve both environments: whatever API URL, Turnstile key and Sanity dataset
  # were passed at build time are frozen inside the JavaScript. The API has no
  # such problem because it reads its configuration at runtime.
  #
  # The consequence is worth stating plainly: the production image is NOT the
  # same artifact staging validated — it is the same commit, rebuilt with
  # production values. Only a refactor moving these values out of NEXT_PUBLIC_*
  # and into server-side runtime config would change that.
  # Gated on the `STAGING_ENABLED` repository variable so this whole path stays
  # dormant until the environment actually exists. Without the guard, every
  # merge into main would spend minutes building an image whose NEXT_PUBLIC_*
  # values are empty strings — a bundle pointing at no API at all.
  #
  # To turn it on: create the Staging environment, add the *_STAGING secrets
  # below, then set the repository variable STAGING_ENABLED to `true`
  # (Settings > Secrets and variables > Actions > Variables).
  #
  # `vars` is used instead of checking the secrets directly because the
  # `secrets` context is not available in a job-level `if`.
  build-staging:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && vars.STAGING_ENABLED == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trajetto-organization/trajetto-ui
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            METADATA_BASE=${{ secrets.METADATA_BASE_STAGING }}
            NEXT_PUBLIC_HTTP_REQUEST=${{ secrets.NEXT_PUBLIC_HTTP_REQUEST_STAGING }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY_STAGING }}
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ secrets.NEXT_PUBLIC_SANITY_DATASET_STAGING }}

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

  # Production image. Keeps the existing secret names, so nothing that works
  # today has to be touched when staging is introduced.
  build-production:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    # Push only: the dispatch is the PROMOTE button, and it should merely tell
    # the orchestrator to pull the image already built and validated in this
    # push. Rebuilding on dispatch wastes minutes and, worse, could publish an
    # image different from the one that passed the quality gate, in case main
    # moved in the meantime.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trajetto-organization/trajetto-ui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            METADATA_BASE=${{ secrets.METADATA_BASE }}
            NEXT_PUBLIC_HTTP_REQUEST=${{ secrets.NEXT_PUBLIC_HTTP_REQUEST }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

  # Staging redeploys on its own, with no approval: that is the whole point of
  # having it. Every merge into main lands here first, and the environment is
  # cheap to break. The stack points at the `staging` tag.
  # Skipped automatically whenever `build-staging` is skipped, so it inherits
  # the same STAGING_ENABLED guard.
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: Staging

    steps:
      - name: Trigger staging redeploy
        run: |
          curl --fail-with-body --retry 3 --proto '=https' --tlsv1.2 -X POST "${{ secrets.PORTAINER_STAGING_WEBHOOK_URL }}"

  # Production promotion. No `needs`: it depends on no job of this run — the
  # image has been in the registry since its own push.
  #
  # Promoting moves the `stable` tag onto the image being shipped and only then
  # tells production to pull. The production stack is pinned to `stable`, never
  # to `latest`: pinned to `latest` any redeploy would drag in whatever main
  # built most recently, which defeats the point of a promotion.
  promote-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write

    # The line below enables manual approval on GitHub.
    environment: Production

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `imagetools create` retags server-side, without pulling or rebuilding.
      #
      # Skipped until STAGING_ENABLED is set, because the production stack is
      # still pinned to `latest` today. Retagging before the stack is moved to
      # `stable` would achieve nothing, and a failure here would stop the
      # webhook below from firing — breaking a deploy path that works.
      - name: Promote image to stable
        if: vars.STAGING_ENABLED == 'true'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/trajetto-organization/trajetto-ui:stable \
            ghcr.io/trajetto-organization/trajetto-ui:${{ inputs.image_tag }}

      - name: Deploy to Portainer via Webhook
        run: |
          curl --fail-with-body --retry 3 --proto '=https' --tlsv1.2 -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
