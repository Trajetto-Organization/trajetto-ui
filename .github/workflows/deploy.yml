name: Build and Push Frontend to GHCR

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Creates the run button

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Só no push: o dispatch é o botão de PROMOVER para produção, e deve apenas
    # acionar o Portainer para repuxar a imagem já construída e validada neste
    # push. Rebuildar no dispatch desperdiçaria minutos e, pior, poderia
    # publicar uma imagem diferente da que passou pelo portão de qualidade caso
    # a main tenha andado nesse meio tempo.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trajetto-organization/trajetto-ui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            METADATA_BASE=${{ secrets.METADATA_BASE }}
            NEXT_PUBLIC_HTTP_REQUEST=${{ secrets.NEXT_PUBLIC_HTTP_REQUEST }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest

    # Sem `needs`: o deploy não depende de nenhum job deste run. A imagem já
    # está no ghcr desde o push; aqui só avisamos o Portainer para repuxar.
    if: github.event_name == 'workflow_dispatch'

    # The line below enables manual approval on GitHub.
    environment: Production
    steps:
      - name: Deploy to Portainer via Webhook
        run: |
          curl -k -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
