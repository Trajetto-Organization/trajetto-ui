name: Build and Push Frontend to GHCR

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Creates the run button

jobs:
  # Portao de qualidade. Antes disto nada verificava o front-end no CI: um erro
  # de tipo so aparecia no `next build` la no meio do job de Docker, depois de
  # varios minutos, ou passava direto quando o arquivo com o erro nao entrava no
  # grafo do build.
  quality:
    name: Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Alinhado com a base do Dockerfile (node:22.21.1-alpine) e com o
          # job de release.
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Primeiro passo de verificacao: e o mais barato de todos. Nao faz sentido
      # gastar minutos no tsc se o codigo nem esta formatado.
      - name: Lint
        run: yarn lint:check

      - name: Type-check
        run: yarn typecheck

  release:
    name: Release (semantic-release)
    runs-on: ubuntu-latest
    # Depende do build TAMBEM, nao so do quality. Rodando em paralelo, um
    # build-and-push que falhasse nao impedia o release: a tag, o CHANGELOG e a
    # GitHub Release saiam anunciando uma versao cuja imagem nunca chegou no
    # registry. O release e o ultimo passo justamente por ser o unico
    # irreversivel.
    needs: [quality, build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write # criar a tag, a release e commitar o CHANGELOG
      issues: write # comentar nas issues fechadas pela versão
      pull-requests: write # comentar nos PRs incluídos na versão

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # semantic-release precisa do histórico completo: ele descobre a
          # última tag e analisa os commits desde então para decidir se a versão
          # sobe em patch, minor ou major. Com o clone raso padrão não há o que
          # analisar e nenhuma release é criada.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build-and-push:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    # Só no push: o dispatch é o botão de PROMOVER para produção, e deve apenas
    # acionar o Portainer para repuxar a imagem já construída e validada neste
    # push. Rebuildar no dispatch desperdiçaria minutos e, pior, poderia
    # publicar uma imagem diferente da que passou pelo portão de qualidade caso
    # a main tenha andado nesse meio tempo.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trajetto-organization/trajetto-ui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            METADATA_BASE=${{ secrets.METADATA_BASE }}
            NEXT_PUBLIC_HTTP_REQUEST=${{ secrets.NEXT_PUBLIC_HTTP_REQUEST }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest

    # Sem `needs`: o deploy não depende de nenhum job deste run. A imagem já
    # está no ghcr desde o push; aqui só avisamos o Portainer para repuxar.
    if: github.event_name == 'workflow_dispatch'

    # The line below enables manual approval on GitHub.
    environment: Production
    steps:
      - name: Deploy to Portainer via Webhook
        run: |
          curl -k -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
