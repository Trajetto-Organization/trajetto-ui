name: Build and Push Frontend to GHCR

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Creates the run button

jobs:
  # Quality gate. Before this, nothing checked the front-end in CI: a type
  # error only showed up in `next build`, in the middle of the Docker job
  # and several minutes in — or slipped through entirely when the offending
  # file was not part of the build graph.
  quality:
    name: Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile base (node:22.21.1-alpine), the release job and
          # the local environment. Node 20 left support in April 2026 and does not
          # satisfy the engine required by part of the chain (semantic-release
          # requires ^22.14.0 || >=24.10.0).
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # First check of all, because it is the cheapest one. There is no point
      # spending minutes on tsc and the test suite if the code is not even
      # formatted.
      - name: Lint
        run: yarn lint:check

      - name: Type-check
        run: yarn typecheck

  release:
    name: Release (semantic-release)
    runs-on: ubuntu-latest
    # Depends on the build TOO, not only on the checks. Running in parallel, a
    # failing build-and-push did not hold the release back: the tag, the
    # CHANGELOG and the GitHub Release went out announcing a version whose
    # image never reached the registry. The release is the last step precisely
    # because it is the only irreversible one.
    needs: [quality, build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write # create the tag and the release, and commit the CHANGELOG
      issues: write # comment on the issues closed by this version
      pull-requests: write # comment on the PRs included in this version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # semantic-release needs the full history: it finds the last tag and reads
          # the commits since then to decide whether the version goes up by patch,
          # minor or major. With the default shallow clone there is nothing to
          # analyse and no release is ever created.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build-and-push:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    # Push only: the dispatch is the PROMOTE button, and it should merely tell
    # the orchestrator to pull the image already built and validated in this
    # push. Rebuilding on dispatch wastes minutes and, worse, could publish an
    # image different from the one that passed the quality gate, in case main
    # moved in the meantime.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trajetto-organization/trajetto-ui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            METADATA_BASE=${{ secrets.METADATA_BASE }}
            NEXT_PUBLIC_HTTP_REQUEST=${{ secrets.NEXT_PUBLIC_HTTP_REQUEST }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest

    # No `needs`: the deploy depends on no job of this run. The image has been
    # in the registry since the push; here we only trigger the redeploy.
    if: github.event_name == 'workflow_dispatch'

    # The line below enables manual approval on GitHub.
    environment: Production
    steps:
      - name: Deploy to Portainer via Webhook
        run: |
          curl -k -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
