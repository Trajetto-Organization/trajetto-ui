version: "3.8"

services:
  trajetto-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trajetto-ui
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env # Loads ALL base variables from .env
    environment:
      # Override only what needs to be different in production
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
