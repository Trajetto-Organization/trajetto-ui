version: "3.8"

# The web as a Dokploy Compose app in Docker Stack mode: the ALTERNATIVE to
# the Dokploy Application that docs/deploy.md recommends. It is also the
# declarative record of the settings the Application must reproduce
# (environment, health check, update/rollback policy, memory ceiling, the
# apex redirect with HSTS), and the unit tests guard it.

services:
  trajetto-ui:
    # `stable`: the tag the promote job moves (by digest) to the build it
    # ships — which makes the same workflow the rollback path. Staging runs
    # the same file with UI_IMAGE_TAG=staging: the same image, moved there by
    # digest first (decision 12.2); only the environment differs between the
    # two stacks. On a brand-new registry `stable` may not exist yet: the
    # first deploy pins UI_IMAGE_TAG=sha-<commit> (docs/deploy.md).
    image: ghcr.io/trajetto-organization/trajetto-ui:${UI_IMAGE_TAG:-stable}
    # Docker's json-file never rotates on its own, and the host's daemon.json
    # is versioned nowhere: without this the log grows until the node's disk
    # is full — the node that also carries the database's volume.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      # Which deployment this stack is: `production` or `staging` (staging
      # answers robots with noindex). Required: staging runs this same file,
      # and forgetting it would publish staging to search engines.
      APP_ENV: ${APP_ENV:?Defina APP_ENV (production ou staging)}
      # The V8 heap stops at ~2/3 of the container's memory limit (below), so
      # a heap that runs away ends in a clean "heap out of memory" and a
      # restart — not in a cgroup SIGKILL. Raise UI_HEAP_MB and
      # UI_MEMORY_LIMIT together.
      NODE_OPTIONS: --max-old-space-size=${UI_HEAP_MB:-512}
      METADATA_BASE: ${METADATA_BASE}
      HTTP_REQUEST: ${HTTP_REQUEST}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      # Public values, read by the server at run time and handed to the
      # browser (src/env): the image carries none of them, so the one built
      # for staging is the one production runs. The server refuses to start
      # when a required one is missing, and lists them in its log.
      # The API URL the BROWSER calls (HTTP_REQUEST above may be internal).
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Defina PUBLIC_API_URL (URL pública da API)}
      # Optional: Socket.IO's host when it is not the API's.
      PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?Defina TURNSTILE_SITE_KEY (chave do site do Turnstile)}
      # Base map of the tower, the route page and the location picker
      # (decision 7.4): a Leaflet https template with {z}/{x}/{y}, {s}
      # optional. Without it the maps draw on a blank canvas and say so;
      # public OpenStreetMap is development only. The credit is plain text.
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      # Optional dark style, drawn while the theme is dark (decision 16.123).
      # Empty: the light tiles are recolored by a CSS filter.
      MAP_TILE_URL_DARK: ${MAP_TILE_URL_DARK:-}
      MAP_TILE_ATTRIBUTION_DARK: ${MAP_TILE_ATTRIBUTION_DARK:-}
      # Decision 7.3: `true` only once background location is declared in
      # the Play Console, together with the app's EXPO_PUBLIC_BACKGROUND_TRACKING.
      BACKGROUND_TRACKING: ${BACKGROUND_TRACKING:-}
      # Shared with the API: lets it count each browser by its own address on
      # the calls this server makes on the user's behalf (login, refresh, 2FA,
      # tracking). Same value as the API's RATE_LIMIT_FORWARDER_SECRET.
      RATE_LIMIT_FORWARDER_SECRET: ${RATE_LIMIT_FORWARDER_SECRET}
      # Optional: where presigned uploads and signed files live, for the
      # middleware's Content-Security-Policy. Empty means the R2 default.
      CSP_STORAGE_ORIGINS: ${CSP_STORAGE_ORIGINS:-}
    deploy:
      mode: replicated
      replicas: 1
      # The host is shared with the API, Postgres and Redis: without a ceiling
      # a Next server that grows without bound takes the RAM the database
      # lives on. No reservation (it can leave a task unschedulable on a small
      # host) and no CPU limit (throttling hurts p99).
      resources:
        limits:
          memory: ${UI_MEMORY_LIMIT:-768M}
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
        monitor: 30s
      # No attempt limit. `max_attempts: 3` with no window counted restarts
      # over the whole life of the spec: three unhealthy episodes spread over
      # weeks and Swarm stopped recreating the task until the next deploy.
      # The web is stateless; a crash loop costs nothing and is for alerting.
      # A slot Swarm gave up on comes back with
      # `docker service update --force <service>`.
      restart_policy:
        condition: any
        delay: 5s
      # Everything that differs between production and staging behind ONE
      # Traefik comes from the stack's env: two stacks with the same router
      # or middleware name make Traefik drop it, and two with the same Host()
      # steal each other's traffic (docs/deploy.md).
      # The `:?` checks sit in label VALUES: `docker stack deploy` splits
      # `key=value` before interpolating, and reads a `-` inside `${...}` as a
      # default, so no message here has one.
      labels:
        - traefik.enable=true
        # The canonical host (www.intrajetto.com in production).
        - traefik.http.routers.${ROUTER_PREFIX}-web.rule=Host(`${WEB_HOST:?Defina WEB_HOST (ex. www.intrajetto.com)}`)
        - traefik.http.routers.${ROUTER_PREFIX}-web.service=${ROUTER_PREFIX:?Defina ROUTER_PREFIX (único por stack, ex. trajetto)}-web
        - traefik.http.routers.${ROUTER_PREFIX}-web.entrypoints=websecure
        - traefik.http.routers.${ROUTER_PREFIX}-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
        # The bare host (intrajetto.com), which only redirects to WEB_HOST.
        # Required on staging too, on purpose: a second staging host makes
        # staging run this same redirect + HSTS router before production does
        # (labels cannot be optional in a stack file anyway).
        - traefik.http.routers.${ROUTER_PREFIX}-web-apex.rule=Host(`${WEB_APEX_HOST:?Defina WEB_APEX_HOST (ex. intrajetto.com)}`)
        - traefik.http.routers.${ROUTER_PREFIX}-web-apex.entrypoints=websecure
        - traefik.http.routers.${ROUTER_PREFIX}-web-apex.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
        # HSTS first, then the redirect: the 301 itself carries the header.
        # The preload list requires HSTS on the bare domain, and without it
        # the `preload` www sends (next.config.mjs) never qualified.
        - traefik.http.routers.${ROUTER_PREFIX}-web-apex.middlewares=${ROUTER_PREFIX}-apex-hsts,${ROUTER_PREFIX}-to-canonical
        - traefik.http.middlewares.${ROUTER_PREFIX}-apex-hsts.headers.stsSeconds=63072000
        - traefik.http.middlewares.${ROUTER_PREFIX}-apex-hsts.headers.stsIncludeSubdomains=true
        - traefik.http.middlewares.${ROUTER_PREFIX}-apex-hsts.headers.stsPreload=true
        - traefik.http.middlewares.${ROUTER_PREFIX}-apex-hsts.headers.forceSTSHeader=true
        # Any URL the apex router matched, path and query kept, to WEB_HOST.
        - traefik.http.middlewares.${ROUTER_PREFIX}-to-canonical.redirectregex.regex=^https?://[^/]+/(.*)
        - traefik.http.middlewares.${ROUTER_PREFIX}-to-canonical.redirectregex.replacement=https://${WEB_HOST}/$${1}
        - traefik.http.middlewares.${ROUTER_PREFIX}-to-canonical.redirectregex.permanent=true
        - traefik.http.services.${ROUTER_PREFIX}-web.loadbalancer.server.port=3000
        - traefik.http.services.${ROUTER_PREFIX}-web.loadbalancer.passHostHeader=true
        # The network Traefik reaches the container on. Traefik v3 reads the
        # swarm key for stack services; the docker key covers a v2 Traefik.
        - traefik.swarm.network=${TRAEFIK_NETWORK:-dokploy-network}
        - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
    networks:
      - edge
    # busybox wget, not `node -e`: measured in this base image, a Node
    # process per probe is ~52 MB of RSS inside the memory limit; wget ~1 MB.
    # 127.0.0.1: busybox tries only the first address.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    stop_grace_period: 30s

networks:
  # The overlay Traefik lives on — Dokploy's `dokploy-network` by default.
  # External: Dokploy creates it; this stack only joins it.
  edge:
    external: true
    name: ${TRAEFIK_NETWORK:-dokploy-network}
