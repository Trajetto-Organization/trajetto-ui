version: "3.8"

services:
  trajetto-ui:
    image: ghcr.io/trajetto-organization/trajetto-ui:latest
    environment:
      NODE_ENV: production
      METADATA_BASE: ${METADATA_BASE}
      HTTP_REQUEST: ${HTTP_REQUEST}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      SANITY_WEBHOOK_SECRET: ${SANITY_WEBHOOK_SECRET}
    deploy:
      labels:
        - traefik.enable=true
        # Main router for www.intrajetto.com
        - traefik.http.routers.trajetto-ui.rule=Host(`www.intrajetto.com`)
        - traefik.http.routers.trajetto-ui.entrypoints=websecure
        - traefik.http.routers.trajetto-ui.tls.certresolver=letsencryptresolver
        - traefik.http.routers.trajetto-ui.service=trajetto-ui
        # Router to redirect intrajetto.com -> www.intrajetto.com
        - traefik.http.routers.trajetto-redirect.rule=Host(`intrajetto.com`)
        - traefik.http.routers.trajetto-redirect.entrypoints=websecure
        - traefik.http.routers.trajetto-redirect.tls.certresolver=letsencryptresolver
        - traefik.http.routers.trajetto-redirect.middlewares=redirect-to-www
        # Middleware for redirection
        - traefik.http.middlewares.redirect-to-www.redirectregex.regex=^https://intrajetto.com/(.*)
        - traefik.http.middlewares.redirect-to-www.redirectregex.replacement=https://www.intrajetto.com/$${1}
        - traefik.http.middlewares.redirect-to-www.redirectregex.permanent=true
        # Service
        - traefik.http.services.trajetto-ui.loadbalancer.server.port=3000
        - traefik.http.services.trajetto-ui.loadbalancer.passHostHeader=true
        - traefik.docker.network=minha_rede
    networks:
      - minha_rede
    restart: unless-stopped

networks:
  minha_rede:
    external: true
